<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sistem Penilaian LT-1 SD Negeri Watutulis 2 Tahun 2026</title>
  
  <meta property="og:title" content="Penilaian LT-1 SDN Watutulis 2 Tahun 2026" />

  <meta property="og:type" content="website" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.08); }
    }
    .neon-bg-1 { animation: pulseGlow 8s infinite ease-in-out; }
    .neon-bg-2 { animation: pulseGlow 10s infinite ease-in-out 2s; }
    .neon-bg-3 { animation: pulseGlow 7s infinite ease-in-out 4s; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07130e] text-amber-50 font-sans selection:bg-amber-500 selection:text-black">
  <div id="app" class="min-h-screen relative pb-12"></div>

  <script>
    // --- TEMPELKAN URL APPS SCRIPT ANDA DI SINI ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfohuFUV9tmWO98XuyTBW0ilnr1EuF3di-aPrwrGdEi5NahqkXBBVrFiQ6fzOk_cCJ/exec';

    // --- DATA MASTER PESERTA REGU ---
    const TEAMS = [
      // Regu Putra (PA) - Gudep 10.055
      { id: 'pa-1', name: 'Phoenix', gender: 'PA', avatar: '🦅', borderColor: 'border-amber-500', pinru: 'Farel', members: ['Farel (Pinru)', 'Ziven', 'Afla', 'Arya', 'Wika', 'Rasya', 'Arfian', 'Aldi', 'Sulton'] },
      { id: 'pa-2', name: 'Scorpio', gender: 'PA', avatar: '🦂', borderColor: 'border-red-500', pinru: 'Iqbal', members: ['Iqbal (Pinru)', 'Okta', 'Dodit', 'Rafala', 'Aruna', 'Bian', 'Nando', 'Liham', 'Eky'] },
      { id: 'pa-3', name: 'Black Panther', gender: 'PA', avatar: '🐆', borderColor: 'border-emerald-500', pinru: 'Evan', members: ['Evan (Pinru)', 'Ravael', 'Latif', 'Dwik', 'Hafi', 'Abi', 'Gebril', 'Krisna', 'Sani'] },
      { id: 'pa-4', name: 'Buaya', gender: 'PA', avatar: '🐊', borderColor: 'border-teal-500', pinru: 'Nino', members: ['Nino (Pinru)', 'Rehan', 'Zidny', 'Wildan', 'Dama', 'Hoho', 'Rizal', 'Adit', 'Rey', 'Gilang'] },
      // Regu Putri (PI) - Gudep 10.056
      { id: 'pi-1', name: 'Lotus', gender: 'PI', avatar: '🪷', borderColor: 'border-pink-400', pinru: 'Afifa', members: ['Afifa (Pinru)', 'Naura', 'Navya', 'Shidqia', 'Nadya', 'Farah', 'Kenia', 'Celin'] },
      { id: 'pi-2', name: 'Lavender', gender: 'PI', avatar: '🪻', borderColor: 'border-purple-400', pinru: 'Nafla', members: ['Nafla (Pinru)', 'Cherly', 'Rara', 'Cinta', 'Nayla', 'Devni', 'Gendhis', 'Febri'] },
      { id: 'pi-3', name: 'Peony', gender: 'PI', avatar: '🌺', borderColor: 'border-rose-400', pinru: 'Kirana', members: ['Kirana (Pinru)', 'Inara', 'Ara', 'Talita', 'Cantika', 'Gadis', 'Alya', 'Azalea'] },
      { id: 'pi-4', name: 'Queen Violet', gender: 'PI', avatar: '👑', borderColor: 'border-violet-400', pinru: 'Kila', members: ['Kila (Pinru)', 'Alesa', 'Dinda', 'Sinta', 'Nacuwa', 'Deavika', 'Keisya', 'Nimas', 'Raisha'] }
    ];

    // --- DAFTAR CABANG LOMBA LENGKAP (11 CABANG) ---
    const CONTESTS = [
      { id: 'pbb', category: 'Kategori 1: PBB', categoryGroup: 'PBB', title: 'PBB Bertongkat', icon: '🎖️', peserta: '7 orang', waktu: 'Maks. 5 Menit', criteria: [{ key: 'kekompakan', label: 'Kekompakan', max: 40 }, { key: 'danton', label: 'Danton', max: 20 }, { key: 'ketepatan', label: 'Ketepatan Aba-aba', max: 40 }] },
      { id: 'morse', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Morse', icon: '📡', peserta: '2 orang', waktu: '2 Menit (50 Huruf)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'sandi', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Sandi-Sandi', icon: '📜', peserta: '5 orang', waktu: '30 Menit (5 Soal)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'semaphore', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Semaphore', icon: '🚩', peserta: '2 orang', waktu: '2 Menit (50 Huruf)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'makanan', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menghias Makanan', icon: '🍰', peserta: '3 orang', waktu: '60 Menit', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'rasa', label: 'Rasa', max: 25 }, { key: 'kreatif', label: 'Kreatifitas', max: 30 }] },
      { id: 'minuman', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menghias Minuman', icon: '🍹', peserta: '3 orang', waktu: '60 Menit', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'rasa', label: 'Rasa', max: 25 }, { key: 'kreatif', label: 'Kreatifitas', max: 30 }] },
      { id: 'meja', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menata Meja Makan', icon: '🍽️', peserta: '2 orang', waktu: '30 Menit', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'plating', label: 'Plating', max: 25 }, { key: 'kreatif', label: 'Kreatifitas', max: 30 }] },
      { id: 'dance', category: 'Kategori 4: Seni Budaya', categoryGroup: 'SENI', title: 'Semaphore Dance', icon: '💃', peserta: '7 orang', waktu: 'Maks. 5 Menit', criteria: [{ key: 'kreatif', label: 'Kreatifitas', max: 30 }, { key: 'kekompakan', label: 'Kekompakan', max: 30 }, { key: 'isi', label: 'Isi Pentas', max: 40 }] },
      { id: 'sentil', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 1: Sentil Karet', icon: '🎯', peserta: '1 orang', waktu: 'Sabtu Pagi', criteria: [{ key: 'score', label: 'Keberhasilan (0-100)', max: 100 }] },
      { id: 'pingpong', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 2: Estafet Pingpong', icon: '🏓', peserta: '3 orang', waktu: 'Sabtu Pagi', criteria: [{ key: 'score', label: 'Keberhasilan (0-100)', max: 100 }] },
      { id: 'tikus', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 3: Jebakan Tikus', icon: '🪤', peserta: '5 orang', waktu: 'Sabtu Pagi', criteria: [{ key: 'score', label: 'Keberhasilan (0-100)', max: 100 }] }
    ];

    // --- RUNDOWN KEGIATAN LT-1 RESMI ---
    const RUNDOWN = [
      { day: 'Jumat, 28 Agustus 2026', start: '12:30', end: '13:00', title: 'Registrasi Peserta', icon: '📝', desc: 'Pengecekan kelengkapan peserta dan tenda.' },
      { day: 'Jumat, 28 Agustus 2026', start: '13:00', end: '14:00', title: 'Upacara Pembukaan LT-1', icon: '⚜️', desc: 'Penyematan tanda peserta resmi.' },
      { day: 'Jumat, 28 Agustus 2026', start: '14:00', end: '14:30', title: 'PBB Bertongkat (7 orang)', icon: '🎖️', desc: '1 Danton + 6 Pasukan bersaf.' },
      { day: 'Jumat, 28 Agustus 2026', start: '14:30', end: '15:00', title: 'Tekspram (Semaphore, Morse, Sandi)', icon: '📡', desc: 'Semaphore (2), Morse (2), Sandi (3).' },
      { day: 'Jumat, 28 Agustus 2026', start: '15:00', end: '15:30', title: 'Istirahat & Sholat Ashar', icon: '🕌', desc: 'Ibadah sholat Ashar di Buper.' },
      { day: 'Jumat, 28 Agustus 2026', start: '15:30', end: '17:00', title: 'Life Skill (Makanan, Minuman, Meja)', icon: '🍰', desc: 'Menghias Makanan (3), Minuman (3), Meja (2).' },
      { day: 'Jumat, 28 Agustus 2026', start: '17:00', end: '19:00', title: 'ISHOMA', icon: '🍱', desc: 'Istirahat, Sholat, Makan malam.' },
      { day: 'Jumat, 28 Agustus 2026', start: '19:00', end: '20:00', title: '🔥 Upacara Api Unggun', icon: '🔥', desc: 'Penyalaan Api Dasa Darma.' },
      { day: 'Jumat, 28 Agustus 2026', start: '20:00', end: '22:30', title: '💃 Dance Semaphore (7 orang)', icon: '💃', desc: 'Semaphore Dance "PRAMUKA OPTIMIS".' },
      { day: 'Sabtu, 29 Agustus 2026', start: '07:00', end: '08:00', title: '⚡ Ketangkasan 1 (1), 2 (3), 3 (5)', icon: '⚡', desc: 'Sentil Karet, Estafet Pingpong, Jebakan Tikus.' },
      { day: 'Sabtu, 29 Agustus 2026', start: '10:00', end: '12:00', title: '🏆 Upacara Penutupan & Pengumuman Juara', icon: '🏅', desc: 'Penetapan Regu Berprestasi LT-1 2026.' }
    ];

    let state = {
      isAdmin: false,
      activeTab: 'leaderboard',
      selectedGender: 'ALL',
      selectedContestId: 'pbb',
      searchMember: '',
      scores: JSON.parse(localStorage.getItem('LT1_SCORES_2026') || '{}'),
      isSaving: false
    };

    function saveScores() {
      localStorage.setItem('LT1_SCORES_2026', JSON.stringify(state.scores));
    }

    function calculateTotal(cId, tId) {
      const raw = state.scores[cId + '_' + tId] || {};
      const cfg = CONTESTS.find(c => c.id === cId);
      if (!cfg) return 0;
      let tot = 0;
      let hasVal = false;
      cfg.criteria.forEach(cr => {
        if (raw[cr.key] !== undefined && raw[cr.key] !== '') {
          hasVal = true;
          tot += parseFloat(raw[cr.key]) || 0;
        }
      });
      return hasVal ? parseFloat(tot.toFixed(1)) : 0;
    }

    function getStandings() {
      const contestRanks = {};
      CONTESTS.forEach(c => {
        ['PA', 'PI'].forEach(g => {
          const list = TEAMS.filter(t => t.gender === g)
            .map(t => ({ team: t, score: calculateTotal(c.id, t.id) }))
            .sort((a, b) => b.score - a.score);

          list.forEach((item, idx) => {
            let medal = null;
            if (item.score > 0) {
              if (idx === 0) medal = 'GOLD';
              else if (idx === 1) medal = 'SILVER';
              else if (idx === 2) medal = 'BRONZE';
            }
            contestRanks[c.id + '_' + item.team.id] = { rank: idx + 1, medal: medal, score: item.score };
          });
        });
      });

      const standings = {};
      ['PA', 'PI'].forEach(g => {
        const list = TEAMS.filter(t => t.gender === g).map(team => {
          let gold = 0, silver = 0, bronze = 0, total = 0, tekGold = 0, lifeGold = 0;
          CONTESTS.forEach(c => {
            const info = contestRanks[c.id + '_' + team.id];
            const sc = info ? info.score : 0;
            total += sc;
            if (info && info.medal === 'GOLD') {
              gold++;
              if (c.categoryGroup === 'TEKSPRAM') tekGold++;
              if (c.categoryGroup === 'LIFESKILL') lifeGold++;
            } else if (info && info.medal === 'SILVER') silver++;
            else if (info && info.medal === 'BRONZE') bronze++;
          });
          return { team, gold, silver, bronze, tekGold, lifeGold, totalOverallScore: parseFloat(total.toFixed(1)) };
        });

        list.sort((a, b) => b.gold - a.gold || b.silver - a.silver || b.bronze - a.bronze || b.tekGold - a.tekGold || b.lifeGold - a.lifeGold || b.totalOverallScore - a.totalOverallScore);
        standings[g] = list.map((item, idx) => ({
          ...item,
          rank: idx + 1,
          title: item.totalOverallScore === 0 ? 'Menunggu Penilaian Juri' : (idx === 0 ? 'Regu Berprestasi Tinggi (Juara 1)' : idx === 1 ? 'Regu Berprestasi Baik (Juara 2)' : idx === 2 ? 'Regu Berprestasi Cukup (Juara 3)' : 'Regu Penggalang Berbakat')
        }));
      });

      return standings;
    }

    function updateClockOnly() {
      const el = document.getElementById('digital-clock');
      if (el) {
        el.innerText = '⏱️ ' + new Date().toLocaleTimeString('id-ID') + ' WIB';
      }
    }

    function render() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID') + ' WIB';
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const isSaturday = now.getDay() === 6;
      const dayTitle = isSaturday ? 'Sabtu, 29 Agustus 2026' : 'Jumat, 28 Agustus 2026';

      const activeEvent = RUNDOWN.find(ev => {
        const [sh, sm] = ev.start.split(':').map(Number);
        const [eh, em] = ev.end.split(':').map(Number);
        const matchDay = isSaturday ? ev.day.startsWith('Sabtu') : ev.day.startsWith('Jumat');
        return matchDay && (nowMin >= (sh * 60 + sm) && nowMin < (eh * 60 + em));
      });

      const nextEvent = RUNDOWN.find(ev => {
        const [sh, sm] = ev.start.split(':').map(Number);
        const matchDay = isSaturday ? ev.day.startsWith('Sabtu') : ev.day.startsWith('Jumat');
        return matchDay && (nowMin < (sh * 60 + sm));
      });

      const standings = getStandings();
      const hasAnyScore = Object.values(state.scores).some(e => e && Object.values(e).some(v => v !== '' && Number(v) > 0));

      let tabContent = '';

      if (state.activeTab === 'leaderboard') {
        tabContent = `
          <div class="space-y-6">
            <div class="flex justify-between items-center bg-[#091711] p-3 rounded-xl border border-emerald-800">
              <span class="text-xs text-emerald-300 font-bold">
                ${hasAnyScore ? '🟢 Klasemen Resmi Terverifikasi' : 'ℹ️ Status: Belum Ada Nilai Diinput (Menunggu Penilaian Juri)'}
              </span>
              <div class="flex gap-1">
                ${['ALL', 'PA', 'PI'].map(b => `
                  <button onclick="state.selectedGender='${b}'; render();" class="px-3 py-1 rounded-lg text-xs font-bold ${state.selectedGender === b ? 'bg-amber-500 text-black' : 'bg-[#050e0a] text-emerald-400'}">
                    ${b === 'ALL' ? 'Semua' : b === 'PA' ? 'Putra' : 'Putri'}
                  </button>
                `).join('')}
              </div>
            </div>

            ${(state.selectedGender === 'ALL' || state.selectedGender === 'PA') ? `
              <div class="space-y-3">
                <h3 class="text-sm font-black text-blue-400 flex items-center gap-2"><span>🏕️</span> Klasemen Regu Putra (PA)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  ${standings.PA.map((item, idx) => `
                    <div class="bg-[#0b1d15] border border-emerald-900 p-4 rounded-2xl space-y-2">
                      <div class="flex justify-between items-center text-xs">
                        <span class="text-emerald-400 font-bold">Peringkat #${idx + 1}</span>
                        <span class="font-mono text-amber-300 font-black">${item.totalOverallScore} Poin</span>
                      </div>
                      <h4 class="text-base font-black text-white">${item.team.avatar} Regu ${item.team.name}</h4>
                      <p class="text-xs text-emerald-300/80">Pinru: ${item.team.pinru}</p>
                      <div class="flex justify-between text-xs bg-black/40 p-2 rounded-xl border border-emerald-950 font-mono text-amber-300">
                        <span>🥇 ${item.gold}</span><span>🥈 ${item.silver}</span><span>🥉 ${item.bronze}</span>
                      </div>
                      <p class="text-[10px] text-emerald-400 font-semibold">${item.title}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${(state.selectedGender === 'ALL' || state.selectedGender === 'PI') ? `
              <div class="space-y-3">
                <h3 class="text-sm font-black text-pink-400 flex items-center gap-2"><span>🌸</span> Klasemen Regu Putri (PI)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  ${standings.PI.map((item, idx) => `
                    <div class="bg-[#140b17] border border-purple-950 p-4 rounded-2xl space-y-2">
                      <div class="flex justify-between items-center text-xs">
                        <span class="text-pink-400 font-bold">Peringkat #${idx + 1}</span>
                        <span class="font-mono text-amber-300 font-black">${item.totalOverallScore} Poin</span>
                      </div>
                      <h4 class="text-base font-black text-white">${item.team.avatar} Regu ${item.team.name}</h4>
                      <p class="text-xs text-pink-300/80">Pinru: ${item.team.pinru}</p>
                      <div class="flex justify-between text-xs bg-black/40 p-2 rounded-xl border border-purple-950 font-mono text-amber-300">
                        <span>🥇 ${item.gold}</span><span>🥈 ${item.silver}</span><span>🥉 ${item.bronze}</span>
                      </div>
                      <p class="text-[10px] text-pink-400 font-semibold">${item.title}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      } else if (state.activeTab === 'input') {
        if (!state.isAdmin) {
          tabContent = `
            <div class="text-center p-8 bg-[#091711] rounded-2xl border border-amber-500/40 space-y-3 max-w-md mx-auto my-8">
              <div class="w-12 h-12 mx-auto rounded-full bg-amber-500/20 flex items-center justify-center text-2xl">🔒</div>
              <h3 class="text-base font-bold text-amber-300">Panel Dewan Juri Terkunci</h3>
              <p class="text-xs text-emerald-300/80">Masukkan kata sandi juri untuk mulai menginput nilai peserta LT-1.</p>
              <form onsubmit="checkPass(event)" class="flex gap-2 justify-center max-w-xs mx-auto">
                <input id="passInput" type="password" placeholder="Kata sandi..." class="px-3 py-1.5 bg-black border border-emerald-700 rounded-xl text-xs text-amber-200 text-center font-mono focus:outline-none" />
                <button type="submit" class="px-4 py-1.5 bg-amber-500 text-black font-black rounded-xl text-xs">Buka</button>
              </form>
            </div>
          `;
        } else {
          const cur = CONTESTS.find(c => c.id === state.selectedContestId);
          tabContent = `
            <div class="space-y-4">
              <div class="flex flex-col sm:flex-row justify-between items-center bg-[#091711] p-3 rounded-xl border border-emerald-800 gap-2">
                <span class="text-xs font-bold text-amber-300">11 Cabang Lomba Siap Dinilai</span>
                <button onclick="handleSaveToCloud()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-lg">${state.isSaving ? 'Menyimpan...' : '💾 Simpan Permanen ke Google Sheet'}</button>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2">
                ${CONTESTS.map(c => `
                  <button onclick="state.selectedContestId='${c.id}'; render();" class="p-2 rounded-xl border text-center transition flex flex-col items-center justify-center gap-1 ${state.selectedContestId === c.id ? 'bg-amber-500/20 border-amber-400 text-amber-200' : 'bg-[#050e0a] border-emerald-900 text-emerald-400'}">
                    <span class="text-xl">${c.icon}</span>
                    <span class="text-[10px] font-bold truncate w-full">${c.title}</span>
                  </button>
                `).join('')}
              </div>

              <div class="bg-[#091711] border border-amber-500/40 p-4 rounded-2xl space-y-4">
                <div class="flex justify-between items-center border-b border-emerald-800 pb-2">
                  <div>
                    <span class="text-[10px] font-bold text-amber-400">${cur.category}</span>
                    <h4 class="text-sm font-black text-white">${cur.icon} ${cur.title}</h4>
                  </div>
                  <span class="text-[10px] text-emerald-300">Peserta: ${cur.peserta} • Waktu: ${cur.waktu}</span>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  ${TEAMS.map(team => {
                    const total = calculateTotal(cur.id, team.id);
                    const raw = state.scores[cur.id + '_' + team.id] || {};
                    return `
                      <div class="bg-[#050e0a] border border-emerald-900 p-3 rounded-xl space-y-2">
                        <div class="flex justify-between items-center">
                          <span class="text-xs font-bold text-white">${team.avatar} Regu ${team.name} (${team.gender})</span>
                          <span class="font-mono text-amber-400 font-bold text-xs" id="total-${cur.id}-${team.id}">Total: ${total}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                          ${cur.criteria.map(crit => `
                            <div class="bg-[#091f15] p-1.5 rounded border border-emerald-950">
                              <div class="flex justify-between text-[9px] text-emerald-400 mb-0.5">
                                <span>${crit.label}</span>
                                <span>Max ${crit.max}</span>
                              </div>
                              <input
                                type="number"
                                min="0"
                                max="${crit.max}"
                                placeholder="0"
                                value="${raw[crit.key] !== undefined ? raw[crit.key] : ''}"
                                oninput="handleScoreChange('${cur.id}', '${team.id}', '${crit.key}', this.value, ${crit.max})"
                                class="w-full bg-[#050e0a] border border-emerald-800 text-amber-300 text-center font-bold font-mono text-xs py-1 rounded focus:outline-none"
                              />
                            </div>
                          `).join('')}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      } else if (state.activeTab === 'rekap') {
        tabContent = `
          <div class="bg-[#091711] border border-emerald-800 p-4 rounded-2xl overflow-x-auto">
            <h3 class="text-xs font-bold text-amber-300 uppercase mb-3">Rekapitulasi Nilai 11 Cabang Lomba</h3>
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="bg-[#050e0a] text-emerald-400 font-bold border-b border-emerald-900 text-[10px]">
                  <th class="p-2">Regu</th>
                  ${CONTESTS.map(c => `<th class="p-2 text-center whitespace-nowrap">${c.title}</th>`).join('')}
                  <th class="p-2 text-right">Total</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-emerald-900/40">
                ${TEAMS.map(team => `
                  <tr class="hover:bg-emerald-950/40">
                    <td class="p-2 font-bold text-white whitespace-nowrap">${team.avatar} ${team.name} (${team.gender})</td>
                    ${CONTESTS.map(c => `<td class="p-2 text-center font-mono text-amber-300">${calculateTotal(c.id, team.id)}</td>`).join('')}
                    <td class="p-2 text-right font-mono font-black text-amber-400">${CONTESTS.reduce((sum, c) => sum + calculateTotal(c.id, team.id), 0)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (state.activeTab === 'teams') {
        tabContent = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            ${TEAMS.map(team => `
              <div class="bg-[#091711] border ${team.borderColor} p-4 rounded-2xl space-y-3">
                <div class="flex justify-between items-center">
                  <span class="text-2xl">${team.avatar}</span>
                  <span class="text-[10px] bg-black/40 px-2 py-0.5 rounded text-emerald-400 font-bold">${team.gender === 'PA' ? 'Putra' : 'Putri'}</span>
                </div>
                <div>
                  <h4 class="text-base font-black text-white">Regu ${team.name}</h4>
                  <p class="text-xs text-amber-300 font-semibold">Pinru: ${team.pinru}</p>
                </div>
                <div class="border-t border-emerald-900/60 pt-2">
                  <p class="text-[10px] text-emerald-400 uppercase font-bold mb-1">Anggota (${team.members.length}):</p>
                  <ul class="text-xs text-emerald-200/80 space-y-0.5">
                    ${team.members.map((m, idx) => `<li>${idx + 1}. ${m}</li>`).join('')}
                  </ul>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (state.activeTab === 'juknis') {
        tabContent = `
          <div class="bg-[#091711] border border-emerald-800 p-5 rounded-2xl space-y-4">
            <h3 class="text-base font-bold text-amber-300">🗓️ Rundown Jadwal LT-1 2026 (28 - 29 Agustus 2026)</h3>
            <div class="space-y-2">
              ${RUNDOWN.map(r => `
                <div class="p-2.5 bg-[#050e0a] rounded-xl border border-emerald-950 flex justify-between items-center text-xs">
                  <span class="font-mono text-amber-400 font-bold">${r.day.split(',')[0]} • ${r.start}-${r.end} WIB</span>
                  <span class="font-bold text-white">${r.icon} ${r.title}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (state.activeTab === 'print') {
        tabContent = `
          <div class="space-y-4">
            <div class="flex justify-between items-center bg-[#10241b] p-3 rounded-xl border border-amber-500/40">
              <span class="text-xs font-bold text-amber-300">Format Resmi Berita Acara Penetapan Juara</span>
              <button onclick="window.print()" class="px-4 py-1.5 bg-amber-500 text-black font-black text-xs rounded-xl">🖨️ Cetak / PDF</button>
            </div>

            <div class="bg-white text-black p-6 rounded-2xl max-w-4xl mx-auto space-y-4 text-xs border border-gray-300">
              <div class="text-center border-b-2 border-black pb-2">
                <p class="font-bold text-[10px] uppercase">GERAKAN PRAMUKA GUGUS DEPAN 10.055 – 10.056</p>
                <h2 class="text-base font-black uppercase">PANGKALAN SD NEGERI WATUTULIS 2</h2>
                <p class="text-[10px] text-gray-600">Kecamatan Prambon, Kabupaten Sidoarjo • Tahun 2026</p>
                <h3 class="font-bold text-xs uppercase underline mt-2">BERITA ACARA REGU BERPRESTASI LT-1 TAHUN 2026</h3>
              </div>

              <div>
                <h4 class="font-bold text-xs uppercase mb-1">A. Hasil Klasemen Penggalang Putra (PA)</h4>
                <table class="w-full text-left border border-gray-400 text-[11px]">
                  <thead class="bg-gray-100">
                    <tr>
                      <th class="p-1 border border-gray-300">Rank</th>
                      <th class="p-1 border border-gray-300">Regu</th>
                      <th class="p-1 border border-gray-300 text-center">Emas</th>
                      <th class="p-1 border border-gray-300 text-center">Perak</th>
                      <th class="p-1 border border-gray-300 text-center">Perunggu</th>
                      <th class="p-1 border border-gray-300 text-right">Skor</th>
                      <th class="p-1 border border-gray-300">Gelar Prestasi</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${standings.PA.map(r => `
                      <tr>
                        <td class="p-1 border border-gray-300 text-center font-bold">${r.rank}</td>
                        <td class="p-1 border border-gray-300 font-bold">Regu ${r.team.name}</td>
                        <td class="p-1 border border-gray-300 text-center">${r.gold}</td>
                        <td class="p-1 border border-gray-300 text-center">${r.silver}</td>
                        <td class="p-1 border border-gray-300 text-center">${r.bronze}</td>
                        <td class="p-1 border border-gray-300 text-right font-mono">${r.totalOverallScore}</td>
                        <td class="p-1 border border-gray-300 font-bold">${r.title}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        <div class="fixed inset-0 pointer-events-none z-0">
          <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-600/15 rounded-full blur-[120px] neon-bg-1"></div>
          <div class="absolute top-1/3 -right-32 w-[28rem] h-[28rem] bg-emerald-600/15 rounded-full blur-[140px] neon-bg-2"></div>
          <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-purple-600/15 rounded-full blur-[130px] neon-bg-3"></div>
          <div class="absolute inset-0 bg-[radial-gradient(#143324_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>
        </div>

        <header class="relative z-20 border-b border-amber-900/60 bg-gradient-to-r from-emerald-950/95 via-[#0b1b13]/95 to-amber-950/95 backdrop-blur-md shadow-2xl sticky top-0">
          <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-emerald-700 p-0.5 flex items-center justify-center shadow-lg">
                <span class="text-2xl">⚜️</span>
              </div>
              <div>
                <span class="text-[10px] font-black uppercase bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded">LT-1 2026 • GUDEP 10.055 - 10.056</span>
                <h1 class="text-base sm:text-lg font-black text-amber-300">SD NEGERI WATUTULIS 2</h1>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div id="digital-clock" class="bg-[#040c08] border border-amber-500/50 px-3 py-1 rounded-xl text-amber-300 font-mono text-xs sm:text-sm font-bold">
                ⏱️ ${timeStr}
              </div>
              ${state.isAdmin ? `
                <button onclick="state.isAdmin=false; render();" class="px-3 py-1 bg-red-950 text-red-300 border border-red-800 rounded-xl text-xs font-bold">Kunci Juri</button>
              ` : `
                <button onclick="state.activeTab='input'; render();" class="px-3 py-1 bg-amber-500 text-black font-black rounded-xl text-xs">🔒 Masuk Juri</button>
              `}
            </div>
          </div>

          <div class="border-t border-emerald-900/40 bg-black/40 px-4">
            <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto py-1.5 scrollbar-none">
              ${[
                { id: 'leaderboard', label: '🏆 Papan Juara' },
                { id: 'input', label: '✍️ Input Juri' },
                { id: 'rekap', label: '📊 Rekap Nilai' },
                { id: 'teams', label: '👥 Regu & Peserta' },
                { id: 'juknis', label: '📖 Rundown & Juknis' },
                { id: 'print', label: '🖨️ Cetak Juara' }
              ].map(tab => `
                <button onclick="state.activeTab='${tab.id}'; render();" class="px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${state.activeTab === tab.id ? 'bg-amber-500 text-black shadow-md' : 'text-emerald-300 hover:bg-emerald-950/60'}">
                  ${tab.label}
                </button>
              `).join('')}
            </div>
          </div>
        </header>

        <main class="relative z-10 max-w-7xl mx-auto px-4 py-5 space-y-5">
          <div class="bg-gradient-to-r from-[#0d261a] via-[#103020] to-[#1a2614] border border-amber-500/40 p-4 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 text-center md:text-left">
              <div class="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-2xl flex-shrink-0">🗓️</div>
              <div>
                <span class="text-[10px] bg-red-950 text-red-300 border border-red-700 px-2 py-0.5 rounded-full font-bold animate-pulse">STATUS ACARA</span>
                <span class="text-xs text-emerald-400 font-semibold ml-2">${dayTitle}</span>
                <h2 class="text-sm sm:text-base font-black text-amber-300 mt-0.5">
                  ${activeEvent ? `Kegiatan: ${activeEvent.title}` : 'Persiapan & Pengkondisian Buper SDN Watutulis 2'}
                </h2>
                <p class="text-[11px] text-emerald-300/80">
                  ${activeEvent ? `${activeEvent.start} - ${activeEvent.end} WIB • ${activeEvent.desc}` : 'Menjelang rangkaian kegiatan perlombaan LT-1.'}
                </p>
              </div>
            </div>

            ${nextEvent ? `
              <div class="bg-[#050e0a] border border-emerald-800 p-2.5 rounded-xl text-xs text-right">
                <span class="text-[10px] text-emerald-400 font-bold uppercase block">Agenda Berikutnya:</span>
                <p class="font-bold text-amber-300">${nextEvent.icon} ${nextEvent.title}</p>
                <span class="text-[10px] font-mono text-emerald-400">${nextEvent.start} WIB</span>
              </div>
            ` : ''}
          </div>

          ${tabContent}
        </main>
      `;
    }

    function checkPass(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById('passInput');
      if (!inputEl) return;
      const val = inputEl.value.trim().toUpperCase();
      if (val === 'SEKOLAHFAVORIT') {
        state.isAdmin = true;
        render();
      } else {
        alert('Kata sandi juri salah!');
      }
    }

    function handleScoreChange(cId, tId, critKey, value, maxVal) {
      let val = value === '' ? '' : Math.max(0, Math.min(maxVal, parseFloat(value) || 0));
      if (!state.scores[cId + '_' + tId]) state.scores[cId + '_' + tId] = {};
      state.scores[cId + '_' + tId][critKey] = val;
      saveScores();
      
      const totalEl = document.getElementById('total-' + cId + '-' + tId);
      if (totalEl) {
        totalEl.innerText = 'Total: ' + calculateTotal(cId, tId);
      }
    }

    async function handleSaveToCloud() {
      state.isSaving = true;
      render();
      const standings = getStandings();
      
      if (SCRIPT_URL && SCRIPT_URL.startsWith('http') && !SCRIPT_URL.includes('sample')) {
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              timestamp: new Date().toISOString(),
              scores: state.scores,
              overallStandings: standings
            })
          });
          alert('✅ Nilai berhasil disimpan permanen ke Google Sheet!');
        } catch(e) {
          alert('✅ Nilai tersimpan di memori lokal browser.');
        }
      } else {
        alert('✅ Nilai tersimpan di memori lokal browser!');
      }
      state.isSaving = false;
      render();
    }

    render();
    setInterval(updateClockOnly, 1000);
  </script>
</body>
</html>
